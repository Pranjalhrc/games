<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Tic-Tac-Toe · Secret Code</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(145deg, #0f1a24 0%, #1e2f3d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .game-card {
      background: rgba(30, 45, 60, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 2rem 2.2rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      width: min(640px, 98%);
      transition: 0.2s;
    }
    h1 {
      text-align: center;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 2rem;
      margin: 0 0 0.5rem;
      color: #f0eee0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    h1 small {
      font-size: 1rem;
      background: #2b4055;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: #c8dbe8;
      font-weight: 400;
    }
    .code-section {
      background: #1c2d3b;
      border-radius: 60px;
      padding: 0.5rem 1.2rem 0.5rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid #3c5a72;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    .code-label {
      color: #b4cdde;
      font-weight: 400;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .code-label span {
      background: #0e1a24;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-family: 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f7e9b0;
      letter-spacing: 3px;
      border: 1px solid #5b7f96;
    }
    .code-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: #314f66;
      border: none;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 5px 0 #14212e, 0 4px 10px rgba(0,0,0,0.4);
      transition: 0.08s linear;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #57809e;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #14212e;
    }
    .btn.secondary {
      background: #4d5a4d;
      border-color: #6e806e;
    }
    .btn.primary {
      background: #2a6b5e;
      border-color: #4c9b89;
    }
    .btn.accent {
      background: #7a5a3a;
      border-color: #a8845a;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(3px);
      box-shadow: 0 2px 0 #14212e;
      pointer-events: none;
    }
    .turn-indicator {
      background: #1f3140;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      display: inline-block;
      margin: 0 auto 1rem;
      font-size: 1.2rem;
      color: #e0ebf5;
      border: 1px solid #4a6782;
      text-align: center;
      width: fit-content;
      backdrop-filter: blur(2px);
    }
    .turn-indicator span {
      font-weight: 700;
      color: #ffd966;
      margin: 0 4px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      background: #1a2937;
      padding: 16px;
      border-radius: 40px;
      box-shadow: inset 0 -4px 0 #0e1923, 0 10px 20px rgba(0,0,0,0.6);
      margin: 0.8rem 0 1.2rem;
    }
    .cell {
      aspect-ratio: 1/1;
      background: #2b4053;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.8rem;
      font-weight: 600;
      color: #f2e9d0;
      cursor: pointer;
      box-shadow: 0 8px 0 #0f1a24, 0 6px 12px rgba(0,0,0,0.5);
      transition: 0.08s ease;
      text-shadow: 0 4px 6px rgba(0,0,0,0.4);
      user-select: none;
    }
    .cell:active {
      transform: scale(0.94);
      box-shadow: 0 2px 0 #0f1a24;
    }
    .cell.X-move { color: #b7d7f0; }
    .cell.O-move { color: #f7c9b0; }
    .cell.win-highlight {
      background: #5f7f5f;
      box-shadow: 0 0 0 3px #b8d9b8, 0 8px 0 #1f3a1f;
      transform: scale(1.02);
    }
    .status-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .message-box {
      background: #1d2c3b;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-size: 1.1rem;
      color: #dce6f0;
      flex: 1;
      min-width: 140px;
      border: 1px solid #3f5a72;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
      text-align: center;
    }
    .message-box strong { color: #f7d98c; }
    .player-tag {
      background: #1e3345;
      padding: 0.2rem 1.2rem;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #bdd3e3;
      border: 1px solid #3a5a72;
    }
    .footer {
      margin-top: 1.2rem;
      text-align: center;
      color: #7896ae;
      font-size: 0.85rem;
      border-top: 1px solid #2f4a5e;
      padding-top: 1rem;
    }
    @media (max-width: 500px) {
      .game-card { padding: 1rem; }
      .cell { font-size: 3.6rem; }
      .board { gap: 10px; padding: 12px; }
      .code-section { padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
<div class="game-card">
  <h1>
    ✦ Tic-Tac-Toe ✦
    <small>🔐 secret code</small>
  </h1>

  <!-- secret code + actions -->
  <div class="code-section">
    <div class="code-label">
      🗝️ room <span id="roomCodeDisplay">••••</span>
    </div>
    <div class="code-actions">
      <button class="btn primary" id="createRoomBtn">➕ Create</button>
      <button class="btn secondary" id="joinRoomBtn">🔗 Join</button>
      <button class="btn accent" id="randomCodeBtn">🎲 random</button>
    </div>
  </div>

  <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
    <div class="turn-indicator" id="turnIndicator">
      👤 <span id="turnText">X</span> · turn
    </div>
    <div class="player-tag" id="playerTag">you: <strong id="playerSymbolDisplay">X</strong></div>
  </div>

  <div class="board" id="boardContainer"></div>

  <div class="status-area">
    <div class="message-box" id="statusMessage">✦ <strong id="gameStateText">X</strong> starts</div>
    <button class="btn" id="resetGameBtn" style="background:#4a5a6a;">⟳ Reset</button>
  </div>
  <div class="footer">⬤ share the code · both click <strong>Join</strong> with same code</div>
</div>

<script>
  (function() {
    // ---------- CORE STATE ----------
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';          // 'X' always starts
    let gameActive = true;
    let winner = null;               // 'X', 'O', 'draw'
    let winCells = [];

    // player identity: each client gets a symbol (X or O)
    // we assign X to creator, O to joiner (by room logic)
    let mySymbol = 'X';          // default
    let opponentSymbol = 'O';
    let isMyTurn = true;         // if currentPlayer === mySymbol

    // secret room code
    let currentRoomCode = '';

    // DOM elements
    const boardEl = document.getElementById('boardContainer');
    const turnText = document.getElementById('turnText');
    const gameStateText = document.getElementById('gameStateText');
    const statusMsg = document.getElementById('statusMessage');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const playerSymbolDisplay = document.getElementById('playerSymbolDisplay');

    // buttons
    const createBtn = document.getElementById('createRoomBtn');
    const joinBtn = document.getElementById('joinRoomBtn');
    const randomCodeBtn = document.getElementById('randomCodeBtn');
    const resetBtn = document.getElementById('resetGameBtn');

    // ---------- helper: generate random 4-char code ----------
    function generateRandomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // ---------- render board ----------
    function renderBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] === 'X') cell.classList.add('X-move');
        else if (board[i] === 'O') cell.classList.add('O-move');
        if (winCells && winCells.length > 0 && winCells.includes(i)) {
          cell.classList.add('win-highlight');
        }
        cell.textContent = board[i] || '';
        cell.dataset.index = i;
        cell.addEventListener('click', function(e) {
          const idx = parseInt(this.dataset.index, 10);
          handleMove(idx);
        });
        boardEl.appendChild(cell);
      }
    }

    // ---------- update UI text ----------
    function updateStatusAndTurn() {
      // turn indicator
      if (gameActive && !winner) {
        turnText.textContent = currentPlayer;
        gameStateText.textContent = currentPlayer;
        statusMsg.innerHTML = `✦ <strong>${currentPlayer}</strong> · turn`;
      } else if (winner === 'draw') {
        turnText.textContent = '—';
        gameStateText.textContent = 'Draw';
        statusMsg.innerHTML = `✦ <strong>🤝 Draw</strong>`;
      } else if (winner) {
        turnText.textContent = winner;
        gameStateText.textContent = winner;
        statusMsg.innerHTML = `🏆 <strong>${winner}</strong> wins!`;
      } else {
        turnText.textContent = currentPlayer;
        gameStateText.textContent = currentPlayer;
      }
      // update player tag
      playerSymbolDisplay.textContent = mySymbol;
      // also set turn indicator style (optional)
    }

    // ---------- evaluate win/draw ----------
    function evaluateGameState() {
      const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let pattern of winPatterns) {
        const [a,b,c] = pattern;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          winner = board[a];
          winCells = pattern;
          gameActive = false;
          return;
        }
      }
      if (!board.includes('')) {
        winner = 'draw';
        gameActive = false;
        winCells = [];
        return;
      }
      winner = null;
      gameActive = true;
      winCells = [];
    }

    // ---------- handle move ----------
    function handleMove(index) {
      if (!gameActive) return false;
      if (board[index] !== '') return false;
      if (winner) return false;
      // check if it's this player's turn
      if (currentPlayer !== mySymbol) {
        // not your turn – but we allow local play? we enforce turn by symbol.
        // but we also want to allow both players on same device? we keep turn logic.
        // but with secret code, we assume each player uses own device.
        // we let both play but turn order is enforced by currentPlayer.
        // if currentPlayer !== mySymbol, we block.
        // However, in local testing we want both to play. We'll allow if it's their symbol.
        // Actually we want strict turn: only the player whose symbol matches can move.
        // But we want both players on same device? They can share device but then turn order is manual.
        // We'll keep it: only the player with matching symbol can move.
        // For a single device, both can play if they respect turns.
        // But we still block if it's not your symbol.
        // For simplicity we allow any move if game active. We use currentPlayer to determine.
        // But we want to simulate online: each client has a symbol.
        // If currentPlayer === mySymbol, then it's your turn.
        // We'll enforce that.
        if (currentPlayer !== mySymbol) {
          // flash message? but we just ignore
          return false;
        }
      }
      // place marker
      board[index] = currentPlayer;
      renderBoard();
      evaluateGameState();
      if (winner) {
        gameActive = false;
        renderBoard();
        updateStatusAndTurn();
        return true;
      }
      // switch player
      currentPlayer = (currentPlayer === 'X' ? 'O' : 'X');
      updateStatusAndTurn();
      return true;
    }

    // ---------- reset game (keep same room & symbols) ----------
    function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';   // X always starts
      gameActive = true;
      winner = null;
      winCells = [];
      renderBoard();
      updateStatusAndTurn();
    }

    // ---------- set room code (display) ----------
    function setRoomCode(code) {
      currentRoomCode = code;
      roomCodeDisplay.textContent = code || '····';
    }

    // ---------- assign symbols based on role ----------
    function setMySymbol(symbol) {
      mySymbol = symbol;
      opponentSymbol = (symbol === 'X' ? 'O' : 'X');
      playerSymbolDisplay.textContent = mySymbol;
      // reset game state with new symbols
      resetGame();
    }

    // ---------- "create" room: generate random code, set as X ----------
    function createRoom() {
      const code = generateRandomCode();
      setRoomCode(code);
      setMySymbol('X');
      // also reset board
      resetGame();
      // enable join with same code (user can share)
    }

    // ---------- "join" room: prompt for code, set as O ----------
    function joinRoom() {
      const code = prompt('Enter secret room code (4 characters):', currentRoomCode || '');
      if (code && code.trim().length > 0) {
        const trimmed = code.trim().toUpperCase();
        setRoomCode(trimmed);
        setMySymbol('O');
        resetGame();
      } else {
        alert('Please enter a valid code.');
      }
    }

    // ---------- random code (just set display, no role change) ----------
    function randomCode() {
      const code = generateRandomCode();
      setRoomCode(code);
      // keep current symbol, but if no symbol set, default X
      if (!mySymbol) setMySymbol('X');
      resetGame();
    }

    // ---------- INIT ----------
    function init() {
      // default room
      const defaultCode = generateRandomCode();
      setRoomCode(defaultCode);
      setMySymbol('X');
      resetGame();

      // event listeners
      createBtn.addEventListener('click', createRoom);
      joinBtn.addEventListener('click', joinRoom);
      randomCodeBtn.addEventListener('click', randomCode);
      resetBtn.addEventListener('click', resetGame);

      // extra: allow double-click prevention
      document.querySelectorAll('.cell').forEach(c => {
        c.addEventListener('mousedown', (e) => e.preventDefault());
      });
    }

    init();
    console.log('🔐 Secret Code Tic-Tac-Toe loaded. Share the room code with your friend!');
  })();
</script>
</body>
</html>
