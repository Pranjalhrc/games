<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 A surprise for my sweetu babe 💖</title>
    <style>
        /* Love-filled romantic page */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe6f0 0%, #ffc2d9 50%, #ffb3c6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* floating hearts background */
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            color: rgba(255, 80, 120, 0.25);
            font-size: 2rem;
            animation: floatHeart 12s infinite linear;
            user-select: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.8);
                opacity: 0.2;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* main love card */
        .love-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 250, 250, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 650px;
            width: 100%;
            padding: 3rem 2rem;
            border-radius: 70px 30px 70px 30px;
            box-shadow: 0 30px 50px rgba(230, 50, 100, 0.25),
                        0 0 0 8px rgba(255, 255, 255, 0.6),
                        0 0 0 12px rgba(255, 120, 160, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            animation: softPulse 3s infinite alternate;
        }

        @keyframes softPulse {
            0% { transform: scale(1); box-shadow: 0 30px 50px rgba(230, 50, 100, 0.2), 0 0 0 8px rgba(255, 255, 255, 0.6), 0 0 0 12px rgba(255, 120, 160, 0.2); }
            100% { transform: scale(1.01); box-shadow: 0 40px 60px rgba(230, 50, 100, 0.35), 0 0 0 10px rgba(255, 240, 245, 0.8), 0 0 0 16px rgba(255, 90, 140, 0.4); }
        }

        .love-card:hover {
            transform: scale(1.02);
            box-shadow: 0 45px 70px rgba(220, 40, 90, 0.4), 0 0 0 12px #fff0f5, 0 0 0 20px #ff99bb;
        }

        /* big cute heading */
        h1 {
            font-size: 3rem;
            color: #b3003b;
            text-shadow: 3px 3px 0 #ffb3c6, 6px 6px 0 rgba(255, 150, 180, 0.4);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-weight: 800;
            word-break: break-word;
        }

        h1 span {
            display: inline-block;
            animation: bounceLetter 1.5s infinite alternate;
        }

        @keyframes bounceLetter {
            from { transform: translateY(0px); }
            to { transform: translateY(-8px); }
        }

        .sub-message {
            font-size: 1.4rem;
            color: #a13156;
            margin-bottom: 2rem;
            font-style: italic;
            font-weight: 500;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sub-message .emoji-big {
            font-size: 2rem;
            display: inline-block;
            animation: wiggle 2s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-10deg); }
        }

        /* the star of the show: PDF open link styled as a lovely button */
        .pdf-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff3b6f, #ff6b9d);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            padding: 1.2rem 3.5rem;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 15px 0 #a1003a, 0 20px 30px rgba(200, 0, 70, 0.4);
            transition: all 0.15s ease;
            margin: 25px 0 15px 0;
            letter-spacing: 2px;
            border: 3px solid #fff0f5;
            position: relative;
            cursor: pointer;
            text-transform: uppercase;
            animation: glow 2s infinite alternate;
        }

        .pdf-button:hover {
            background: linear-gradient(135deg, #ff1f5a, #ff4d8f);
            transform: translateY(5px);
            box-shadow: 0 10px 0 #a1003a, 0 25px 35px rgba(200, 0, 70, 0.5);
        }

        .pdf-button:active {
            transform: translateY(12px);
            box-shadow: 0 5px 0 #a1003a, 0 20px 30px rgba(200, 0, 70, 0.4);
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #ffb6c1; }
            to { text-shadow: 0 0 15px #fff, 0 0 30px #ff99bb, 0 0 40px #ff4d6d; }
        }

        .pdf-button::before {
            content: "📄";
            margin-right: 15px;
            font-size: 2rem;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
        }

        .pdf-button::after {
            content: "❤️";
            margin-left: 15px;
            font-size: 2rem;
            animation: heartBeat 1s infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .love-note {
            font-size: 1.2rem;
            color: #b3446c;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed #ffb0c8;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: 500;
        }

        .love-note .small {
            font-size: 1rem;
            opacity: 0.85;
        }

        .signature {
            font-family: 'Brush Script MT', cursive;
            font-size: 2.2rem;
            color: #c72c5e;
            margin-top: 5px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #ffe0e8;
        }

        /* surprise sparkles */
        .sparkle {
            position: absolute;
            font-size: 1.8rem;
            animation: twinkle 3s infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* responsiveness */
        @media (max-width: 600px) {
            .love-card {
                padding: 2rem 1.2rem;
                border-radius: 45px 20px 45px 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .pdf-button {
                font-size: 1.4rem;
                padding: 1rem 1.8rem;
                letter-spacing: 1px;
            }
            .pdf-button::before,
            .pdf-button::after {
                font-size: 1.4rem;
                margin-right: 8px;
                margin-left: 8px;
            }
            .sub-message {
                font-size: 1.1rem;
            }
            .signature {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.8rem;
            }
            .pdf-button {
                font-size: 1.2rem;
                padding: 0.9rem 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- floating hearts background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- sparkle emojis (fixed position) -->
    <div class="sparkle" style="top: 8%; left: 5%; animation-delay: 0s;">✨</div>
    <div class="sparkle" style="top: 18%; right: 8%; animation-delay: 0.7s;">💖</div>
    <div class="sparkle" style="bottom: 12%; left: 12%; animation-delay: 1.2s;">🌸</div>
    <div class="sparkle" style="bottom: 20%; right: 15%; animation-delay: 0.3s;">⭐</div>
    <div class="sparkle" style="top: 45%; left: 3%; animation-delay: 1.8s;">💕</div>
    <div class="sparkle" style="top: 70%; right: 5%; animation-delay: 0.9s;">✨</div>

    <!-- main romantic card -->
    <div class="love-card">
        <h1>
            <span>H</span><span>e</span><span>y</span>
            <span> </span>
            <span>S</span><span>w</span><span>e</span><span>e</span><span>t</span><span>u</span>
            <span> </span>
            <span>B</span><span>a</span><span>b</span><span>e</span>
            <span>!</span>
        </h1>

        <div class="sub-message">
            <span class="emoji-big">💌</span> I made something just for you <span class="emoji-big">💌</span>
        </div>

        <!-- THE PDF OPEN LINK — clicking opens surprise.pdf -->
        <a href="surprise.pdf" class="pdf-button" target="_blank" rel="noopener noreferrer">
            OPEN PDF
        </a>

        <div class="love-note">
            <div>💝 Click the button above, my love 💝</div>
            <div class="small">a little surprise is waiting inside...</div>
            <div class="signature">— Forever yours ❤️</div>
        </div>
    </div>

    <script>
        // generate floating hearts dynamically for a magical feel
        (function createFloatingHearts() {
            const heartsContainer = document.getElementById('heartsBg');
            const heartSymbols = ['❤️', '💖', '💗', '💓', '💕', '💘', '💝', '🌸', '✨', '💐'];
            const numberOfHearts = 30;

            for (let i = 0; i < numberOfHearts; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-float');
                // random heart symbol
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                // random size between 1.2rem and 3rem
                const size = Math.random() * 1.8 + 1.2;
                heart.style.fontSize = size + 'rem';
                // random horizontal position
                heart.style.left = Math.random() * 100 + '%';
                // random animation duration between 8s and 18s
                heart.style.animationDuration = (Math.random() * 10 + 8) + 's';
                // random animation delay (negative so they start at different points)
                heart.style.animationDelay = (Math.random() * -18) + 's';
                // random opacity baseline (overridden by keyframes, but good)
                heart.style.opacity = Math.random() * 0.5 + 0.2;
                // set a random rotation direction via custom property? not needed
                heartsContainer.appendChild(heart);
            }
        })();

        // Add a tiny extra surprise: a soft click sound? No, just visual.
        // But we'll make the button give a little extra love via console (just for fun)
        console.log("%c💖 Surprise for my sweetu babe! Click the big button! 💖", "font-size: 16px; color: #b3003b; font-weight: bold;");
    </script>
</body>
</html>
