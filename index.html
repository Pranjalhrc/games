<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Game Hub · Tic-Tac-Toe</title>
  <style>
    /* ----- global reset & fonts ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1a2639, #0d1421);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ----- main card (glassmorphism) ----- */
    .hub-card {
      max-width: 780px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 64px;
      padding: 2.2rem 2.5rem 2.8rem;
      box-shadow: 
        0 30px 50px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: 0.25s ease;
    }

    /* ----- header with glow ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      margin-bottom: 2.2rem;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 {
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0efe7, #c8dbe8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 20px rgba(200, 220, 240, 0.15);
    }

    .badge {
      background: #2a4055;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: #bdd9ed;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      border: 1px solid #4a6a84;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.4);
      white-space: nowrap;
    }

    .status-pulse {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a2c3b;
      padding: 0.4rem 1.2rem 0.4rem 1rem;
      border-radius: 60px;
      border: 1px solid #3b5a72;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6fcf97;
      box-shadow: 0 0 12px #6fcf97;
      animation: pulse-glow 1.8s infinite;
    }

    .status-pulse span {
      color: #d0e2f0;
      font-size: 0.95rem;
      font-weight: 400;
    }

    @keyframes pulse-glow {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }

    /* ----- featured game: tic-tac-toe (big card) ----- */
    .featured-game {
      background: linear-gradient(145deg, #1e3142, #14212e);
      border-radius: 48px;
      padding: 1.6rem 2rem 2rem;
      margin-bottom: 2.8rem;
      border: 1px solid #3a5670;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: 0.2s;
    }

    .featured-game:hover {
      border-color: #5a7f9c;
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.7);
    }

    .featured-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .featured-header h2 {
      font-size: 1.9rem;
      font-weight: 500;
      color: #eef3f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .featured-header h2 small {
      font-size: 0.9rem;
      background: #2d4a5e;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      font-weight: 400;
      color: #c4d9e8;
    }

    .play-btn {
      background: #3d6b5e;
      border: none;
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 8px 0 #1d3a30, 0 6px 16px rgba(0,0,0,0.5);
      transition: 0.08s linear;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #5f9b86;
      letter-spacing: 0.3px;
    }

    .play-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #1d3a30;
    }

    .play-btn i {
      font-size: 1.4rem;
      line-height: 1;
    }

    .featured-desc {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem 2.5rem;
      color: #b6cedf;
      font-size: 0.98rem;
      border-top: 1px solid #345067;
      padding-top: 1.2rem;
      margin-top: 0.2rem;
    }

    .featured-desc .tag {
      background: #1b3140;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      color: #d3e3ef;
      border: 1px solid #486580;
    }

    .featured-desc .code-hint {
      background: #0d1c28;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-family: 'Courier New', monospace;
      color: #f7e9b0;
      letter-spacing: 2px;
      border: 1px solid #6a8fa8;
    }

    /* ----- game grid (for future games) ----- */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .game-card-placeholder {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 30px;
      padding: 1.2rem 0.6rem;
      text-align: center;
      border: 1px dashed #3d5770;
      color: #7f9bb3;
      transition: 0.15s;
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .game-card-placeholder .icon {
      font-size: 2.4rem;
      opacity: 0.6;
    }

    .game-card-placeholder .name {
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    .game-card-placeholder .coming {
      background: #1f3345;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #8aadc7;
      border: 1px solid #375367;
    }

    .game-card-placeholder:hover {
      border-color: #6a8ca8;
      background: rgba(255, 255, 255, 0.06);
    }

    /* ----- footer / bottom note ----- */
    .footer-note {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #68849e;
      border-top: 1px solid #274058;
      padding-top: 1.4rem;
      letter-spacing: 0.4px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 2rem;
    }

    .footer-note span {
      background: #1a2d3d;
      padding: 0.1rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #3b5a72;
    }

    /* ----- responsive fine-tune ----- */
    @media (max-width: 550px) {
      .hub-card { padding: 1.5rem; }
      .title-group h1 { font-size: 1.7rem; }
      .featured-game { padding: 1.2rem; }
      .featured-header h2 { font-size: 1.5rem; }
      .play-btn { font-size: 1rem; padding: 0.6rem 1.2rem; }
      .game-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 400px) {
      .game-grid { grid-template-columns: 1fr; }
    }

    /* pseudo icon for play (no external icons) */
    .icon-play::before {
      content: "▶";
      font-size: 1.2rem;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="hub-card">
    <!-- header -->
    <div class="header">
      <div class="title-group">
        <h1>🎮 Game Hub</h1>
        <span class="badge">v0.1</span>
      </div>
      <div class="status-pulse">
        <span class="pulse-dot"></span>
        <span>online · ready</span>
      </div>
    </div>

    <!-- FEATURED: Tic-Tac-Toe (your first game) -->
    <div class="featured-game">
      <div class="featured-header">
        <h2>
          ❌ Tic-Tac-Toe
          <small>secret code</small>
        </h2>
        <!-- play button links to tictoe.html (same folder) -->
        <a href="tictoe.html" style="text-decoration: none;">
          <button class="play-btn">
            <span class="icon-play"></span> Play now
          </button>
        </a>
      </div>

      <div class="featured-desc">
        <span class="tag">👥 2 players</span>
        <span class="tag">🔐 room code</span>
        <span class="code-hint">⚡ share &amp; join</span>
        <span style="margin-left: auto; opacity: 0.7;">⭐ first game</span>
      </div>
    </div>

    <!-- OTHER GAMES (placeholders – you can add more later) -->
    <div style="margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center;">
      <span style="color: #b0ccdf; font-weight: 400; letter-spacing: 0.3px;">📂 more games (coming soon)</span>
      <span style="color: #4a6f8a; font-size: 0.8rem;">+ add yours</span>
    </div>

    <div class="game-grid">
      <!-- placeholder 1 -->
      <div class="game-card-placeholder">
        <div class="icon">🃏</div>
        <div class="name">Card match</div>
        <div class="coming">soon</div>
      </div>
      <!-- placeholder 2 -->
      <div class="game-card-placeholder">
        <div class="icon">🧩</div>
        <div class="name">Puzzle</div>
        <div class="coming">soon</div>
      </div>
      <!-- placeholder 3 -->
      <div class="game-card-placeholder">
        <div class="icon">🎯</div>
        <div class="name">Darts</div>
        <div class="coming">soon</div>
      </div>
      <!-- placeholder 4 -->
      <div class="game-card-placeholder">
        <div class="icon">🎲</div>
        <div class="name">Dice duel</div>
        <div class="coming">soon</div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer-note">
      <span>✦ tictoe.html · 1st game</span>
      <span>⬤ rest games you will enter</span>
      <span>🔗 share this hub</span>
    </div>
  </div>

  <script>
    // optional: small console reminder
    (function() {
      console.log('🎮 Game Hub · Tic-Tac-Toe is ready!');
      console.log('📁 Add your own games by editing the game-grid section.');
      // you can add any future dynamic behavior here
    })();
  </script>
</body>
</html>
